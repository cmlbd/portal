<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Team — Centre for Media Literacy</title>
  <meta name="description" content="Meet the team behind Centre for Media Literacy — directors, advisors, and members.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .team-hero { background: var(--primary); padding: 56px 0 48px; position: relative; }
    .team-hero::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 70% 40%, rgba(200,146,42,0.12) 0%, transparent 55%); }
    /* org tree */
    .v-line { width: 2px; height: 36px; background: var(--border); margin: 0 auto; }
    .h-line  { height: 2px; background: var(--border); }
    .org-level { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    .org-branch { display: flex; flex-direction: column; align-items: center; }
    .org-branch .v-line { height: 36px; }
    .legend { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin: 28px 0 0; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    /* team grid */
    .member-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-white);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
    }
    .member-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); border-color: var(--accent); }
    .member-card .org-avatar { margin: 0 auto 14px; }
    .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
    .ftab { padding: 6px 16px; border-radius: 50px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: var(--bg-white); color: var(--text-body); transition: all var(--transition); }
    .ftab:hover, .ftab.active { background: var(--primary); color: white; border-color: var(--primary); }
  </style>
</head>
<body>

<!-- Header injected by layout.js -->

<!-- Hero -->
<div class="team-hero">
  <div class="container" style="position:relative;z-index:1">
    <div style="max-width:600px">
      <span class="hero-eyebrow">👥 Our People</span>
      <h1 class="hero-title" style="font-size:clamp(1.8rem,3.5vw,2.8rem)">Meet the CML Team</h1>
      <p style="color:rgba(255,255,255,0.7);font-size:15px;line-height:1.7">A dedicated community of media professionals, educators, and advocates working together to build a media-literate society.</p>
    </div>
  </div>
</div>

<!-- Organogram -->
<section class="section section-gray">
  <div class="container">
    <div class="section-header center text-center">
      <span class="section-eyebrow">Structure</span>
      <h2 class="section-title">Organisational Chart</h2>
      <div class="divider-line"></div>
    </div>
    <div id="org-chart" style="overflow-x:auto;padding:10px 0"></div>
    <div class="legend">
      <div class="flex items-center gap-8"><div class="legend-dot" style="background:var(--accent)"></div><span style="font-size:13px;color:var(--text-muted)">Director</span></div>
      <div class="flex items-center gap-8"><div class="legend-dot" style="background:var(--primary)"></div><span style="font-size:13px;color:var(--text-muted)">Admin</span></div>
      <div class="flex items-center gap-8"><div class="legend-dot" style="background:var(--teal)"></div><span style="font-size:13px;color:var(--text-muted)">Advisor</span></div>
      <div class="flex items-center gap-8"><div class="legend-dot" style="background:#94a3b8"></div><span style="font-size:13px;color:var(--text-muted)">Member</span></div>
    </div>
  </div>
</section>

<!-- Team Directory -->
<section class="section">
  <div class="container">
    <div class="section-header">
      <span class="section-eyebrow">Full Directory</span>
      <h2 class="section-title">Team Members</h2>
    </div>
    <div class="filter-tabs" id="ftabs">
      <span class="ftab active" onclick="filterTeam('')">All</span>
      <span class="ftab" onclick="filterTeam('director')">👑 Directors</span>
      <span class="ftab" onclick="filterTeam('admin')">🛡 Admins</span>
      <span class="ftab" onclick="filterTeam('advisor')">💡 Advisors</span>
      <span class="ftab" onclick="filterTeam('member')">👤 Members</span>
    </div>
    <div class="grid-3" id="team-grid"></div>
  </div>
</section>

<!-- Member Modal -->
<div class="modal-overlay" id="member-modal">
  <div class="modal">
    <button class="modal-close" onclick="App.closeModal('member-modal')">✕</button>
    <div id="member-content"></div>
  </div>
</div>

<!-- Footer injected by layout.js -->

<div id="toast-container" class="toast-container"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    Layout.initPublic('team');
    renderOrg();
    renderGrid('');
  });

  function nodeCard(u) {
    const photo = u.photo
      ? `<img src="${u.photo}" alt="${u.name}" style="width:100%;height:100%;object-fit:cover">`
      : App.getInitials(u.name);
    return `<div class="org-node-card ${u.role}" onclick="openMember('${u.id}')" title="${u.name}">
      <div class="org-avatar ${u.role}">${photo}</div>
      <div class="org-name">${u.name}</div>
      <div class="org-title">${u.designation||u.role}</div>
      <div class="org-id">${u.id}</div>
    </div>`;
  }

  function renderOrg() {
    const chart  = document.getElementById('org-chart');
    const dirs   = DB.getUsersByRole('director');
    const admins = DB.getUsersByRole('admin');
    const advs   = DB.getUsersByRole('advisor');
    const mems   = DB.getUsersByRole('member');
    let html = '<div style="min-width:600px">';

    // Directors
    html += `<div class="org-level">${dirs.length?dirs.map(nodeCard).join(''):emptyNode('No Director')}</div>`;
    html += '<div class="v-line"></div>';

    // Level 2 (admins + advisors)
    const l2 = [...admins,...advs];
    if (l2.length) {
      const w = Math.max(l2.length * 200, 400);
      html += `<div class="h-line" style="width:${w}px;margin:0 auto"></div>`;
      html += `<div class="org-level">${l2.map(u=>`<div class="org-branch">${nodeCard(u)}</div>`).join('')}</div>`;
    }

    // Members
    if (mems.length) {
      const w2 = Math.max(mems.length * 190, 400);
      html += '<div class="v-line"></div>';
      html += `<div class="h-line" style="width:${w2}px;margin:0 auto"></div>`;
      html += `<div class="org-level" style="flex-wrap:wrap;">${mems.map(u=>`<div class="org-branch">${nodeCard(u)}</div>`).join('')}</div>`;
    }
    html += '</div>';
    chart.innerHTML = html;
  }

  function emptyNode(label) {
    return `<div style="min-width:150px;padding:18px;border:2px dashed var(--border);border-radius:10px;text-align:center;color:var(--text-light);font-size:13px">${label}</div>`;
  }

  function filterTeam(role) {
    document.querySelectorAll('.ftab').forEach(t=>t.classList.remove('active'));
    event.target.classList.add('active');
    renderGrid(role);
  }

  function renderGrid(role) {
    const grid  = document.getElementById('team-grid');
    const order = {director:0,admin:1,advisor:2,member:3};
    let users   = DB.getUsers();
    if (role) users = users.filter(u=>u.role===role);
    users.sort((a,b)=>(order[a.role]||9)-(order[b.role]||9));
    if (!users.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">👥</div><div class="empty-title">No members found</div></div>`;
      return;
    }
    grid.innerHTML = users.map(u => `
      <div class="member-card anim-up" onclick="openMember('${u.id}')">
        ${App.avatarHtml(u,'lg')}
        <h4 style="font-size:15px;margin-bottom:4px">${u.name}</h4>
        <div style="color:var(--text-muted);font-size:13px;margin-bottom:10px">${u.designation||u.role}</div>
        ${App.getRoleBadge(u.role)}
        <div style="font-size:11px;font-family:monospace;color:var(--text-light);margin-top:8px">${u.id}</div>
      </div>`).join('');
  }

  function openMember(uid) {
    const u = DB.getUserById(uid);
    document.getElementById('member-content').innerHTML = `
      <div style="text-align:center;margin-bottom:20px">
        ${App.avatarHtml(u,'xl')}
        <h3 style="margin-top:14px;margin-bottom:4px">${u.name}</h3>
        <div style="color:var(--accent);font-weight:600;margin-bottom:10px">${u.designation||u.role}</div>
        ${App.getRoleBadge(u.role)}
        <div style="font-family:monospace;font-size:13px;color:var(--text-muted);margin-top:8px">${u.id}</div>
      </div>
      ${u.bio?`<p style="color:var(--text-muted);font-size:14px;line-height:1.7;text-align:center;margin-bottom:18px">${u.bio}</p>`:''}
      <div style="display:grid;gap:8px">
        ${u.email?`<div class="info-row"><div class="info-label">Email</div><div class="info-value">${u.email}</div></div>`:''}
        ${u.phone?`<div class="info-row"><div class="info-label">Phone</div><div class="info-value">${u.phone}</div></div>`:''}
        ${u.department?`<div class="info-row"><div class="info-label">Department</div><div class="info-value">${u.department}</div></div>`:''}
        <div class="info-row"><div class="info-label">Joined</div><div class="info-value">${App.formatDate(u.joinDate)}</div></div>
      </div>`;
    App.openModal('member-modal');
  }
</script>
</body>
</html>
